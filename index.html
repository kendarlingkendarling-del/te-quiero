<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te Quiero</title>
<style>
body{margin:0;height:100vh;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Arial;color:white}
#container{text-align:center;z-index:2}
h1{font-size:70px;margin:0;animation:latido 1s infinite;filter:drop-shadow(0 0 20px #ff0066)}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
p{font-size:20px;opacity:0.8;margin-top:10px}
.corazon{position:absolute;color:#ff0066;animation:flotar 4s linear infinite;font-size:20px}
@keyframes flotar{0%{transform:translateY(100vh) rotate(0deg);opacity:1}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}
button{margin-top:25px;padding:14px 35px;border-radius:30px;border:none;background:white;color:black;font-weight:900;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="container">
<h1>TE QUIERO<br>❤️</h1>
<p id="msg">Eres lo mejor que me ha pasado</p>
<button onclick="cambiar()">Pulsa aquí 💌</button>
</div>
<script>
let frases=[
"Eres lo mejor que me ha pasado",
"Contigo todo es mejor",
"No sabes cuánto te quiero",
"Eres mi persona favorita",
"Cada día me gustas más",
"Eres mi vibe eterna"
];
let i=0;
function cambiar(){
i=(i+1)%frases.length;
document.getElementById('msg').innerText=frases[i];
}
function crearCorazon(){
let c=document.createElement('div');
c.className='corazon';
c.innerText='❤️';
c.style.left=Math.random()*100+'vw';
c.style.animationDuration=(Math.random()*2+3)+'s';
c.style.fontSize=(Math.random()*20+15)+'px';
document.body.appendChild(c);
setTimeout(()=>c.remove(),4000);
}
setInterval(crearCorazon,200);
</script>
</body>
</html>
